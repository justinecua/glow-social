# Production layout. Dev stays on docker-compose.yml.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml up -d --scale api=3   # more API capacity
#
# Request path:  cloudflared -> edge (nginx, 127.0.0.1 only) -> api (Gunicorn) / ws (Daphne) -> postgres16-new
#                                                                                           \-> redis (cache, throttles, channels)
# The database is NOT started here: Glow uses the existing postgres16-new container,
# reached through its Docker network (DB_NETWORK).
services:
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # HTTP API: Gunicorn, many parallel requests (see backend/gunicorn.conf.py).
  api:
    build: ./backend
    env_file: ./backend/.env
    command: ["gunicorn", "GlowProject.wsgi:application", "-c", "gunicorn.conf.py"]
    environment: &app_env
      DEBUG: "False"
      DB_HOST: ${DB_HOST:-postgres16-new}
      DB_PORT: 5432  # port inside the database's network, not the 5433 on the host
      DB_NAME: ${DB_NAME:-glow}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_CONN_MAX_AGE: "0"  # the database is shared with other apps, so don't hold idle connections
      RUN_MIGRATIONS: "False"  # never migrate the live database on startup
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NUM_PROXIES: "1"
      WEB_WORKERS: ${WEB_WORKERS:-4}
      WEB_THREADS: ${WEB_THREADS:-6}
      TZ: Asia/Manila
    volumes:
      - ./backend/media:/app/media  # same folder as MEDIA_ROOT in settings.py
    networks: [default, database]
    depends_on: [redis]
    restart: unless-stopped

  # WebSockets only: Daphne (async consumers scale fine on one process).
  ws:
    build: ./backend
    env_file: ./backend/.env
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "GlowProject.asgi:application"]
    environment: *app_env
    networks: [default, database]
    depends_on: [redis]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Same origin as the edge proxy: the app calls /api and /ws on its own host.
        VITE_HOST: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://glowph.social}
        VITE_WS_HOST: ${PUBLIC_WS_URL:?set PUBLIC_WS_URL, e.g. wss://glowph.social}
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-127.0.0.1:8100}:80"  # keep 127.0.0.1: Docker skips ufw, and cloudflared runs on this server
    volumes:
      - ./docker/nginx/zones.conf:/etc/nginx/conf.d/00-zones.conf:ro
      - ./docker/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/media:/srv/media:ro
    depends_on: [api, ws, frontend]
    restart: unless-stopped

networks:
  database:
    external: true
    name: ${DB_NETWORK:?set DB_NETWORK to the Docker network of postgres16-new}

volumes:
  redis_data:
