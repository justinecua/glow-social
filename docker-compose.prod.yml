# Production layout. Dev stays on docker-compose.yml.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml up -d --scale api=3   # more API capacity
#
# Request path:  edge (nginx) -> api (Gunicorn) / ws (Daphne) -> pgbouncer -> db
#                                                            \-> redis (cache, throttles, channels)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-glow}
      POSTGRES_USER: ${DB_USER:-glow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      TZ: Asia/Manila
    # Log queries slower than 500 ms; size memory for a small dedicated box.
    command: >
      postgres
      -c log_min_duration_statement=500
      -c shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE:-3GB}
      -c work_mem=16MB
      -c max_connections=200
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Connection pooler: many app threads share a few real Postgres connections.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-glow}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_NAME: ${DB_NAME:-glow}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 40
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # HTTP API: Gunicorn, many parallel requests (see backend/gunicorn.conf.py).
  api:
    build: ./backend
    env_file: ./backend/.env
    command: ["gunicorn", "GlowProject.wsgi:application", "-c", "gunicorn.conf.py"]
    environment: &app_env
      DEBUG: "False"
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-glow}
      DB_USER: ${DB_USER:-glow}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      # PgBouncer (transaction pooling) owns pooling: no long-lived Django
      # connections and no server-side cursors.
      DB_CONN_MAX_AGE: "0"
      DB_DISABLE_SERVER_SIDE_CURSORS: "True"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NUM_PROXIES: "1"
      WEB_WORKERS: ${WEB_WORKERS:-4}
      WEB_THREADS: ${WEB_THREADS:-6}
      TZ: Asia/Manila
    volumes:
      - media:/app/media
    depends_on: [pgbouncer, redis]
    restart: unless-stopped

  # WebSockets only: Daphne (async consumers scale fine on one process).
  ws:
    build: ./backend
    env_file: ./backend/.env
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "GlowProject.asgi:application"]
    environment: *app_env
    depends_on: [pgbouncer, redis]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Same origin as the edge proxy: the app calls /api and /ws on its own host.
        VITE_HOST: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://glow.example.com}
        VITE_WS_HOST: ${PUBLIC_WS_URL:?set PUBLIC_WS_URL, e.g. wss://glow.example.com}
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/zones.conf:/etc/nginx/conf.d/00-zones.conf:ro
      - ./docker/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
    depends_on: [api, ws, frontend]
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  media:
