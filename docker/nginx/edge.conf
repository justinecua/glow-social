# Edge proxy for production (docker-compose.prod.yml).
#   /api, /admin, /share, /redoc -> api   (Gunicorn, HTTP)
#   /ws/                         -> ws    (Daphne, WebSockets)
#   /media/                      -> served from disk here (not by Django)
#   everything else              -> frontend (static SPA)
# Put TLS in front of this (Cloudflare, a load balancer, or certbot).

upstream api      { server api:8000;      keepalive 32; }
upstream ws       { server ws:8000; }
upstream frontend { server frontend:80; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  client_max_body_size 85m;          # up to 10 photos x 8 MB per post (multipart)

  # Basic per-IP limits at the edge (Django throttles per account too).
  limit_req zone=api burst=40 nodelay;

  location /media/ {
    alias /srv/media/;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
  }

  location /ws/ {
    proxy_pass http://ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  location ~ ^/(api|admin|share|redoc)/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
  }
}
